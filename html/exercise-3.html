<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 3</title>
  </head>

  <body>
    <main>
      <h1>Formulario</h1>

      <form action="" method="get" target="_blank" autocomplete="on">
        <div>
          <label for="name">Name</label>
          <input
            type="text"
            id="name"
            name="name"
            autocomplete="given-name"
            autocapitalize="words"
            required
          />
        </div>

        <div>
          <label for="last">Last</label>
          <input
            type="text"
            id="last"
            name="last"
            autocomplete="family-name"
            autocapitalize="words"
            required
          />
        </div>

        <div>
          <label for="age">Age</label>
          <input
            type="number"
            id="age"
            name="age"
            min="0"
            required
          />
        </div>

        <div>
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <fieldset>
          <legend>Agree to the terms?</legend>

          <input
            type="radio"
            id="terms-radio-yes"
            name="terms-radio"
            value="yes"
            required
          />
          <label for="terms-radio-yes">Yes</label>

          <input
            type="radio"
            id="terms-radio-no"
            name="terms-radio"
            value="no"
          />
          <label for="terms-radio-no">No</label>
        </fieldset>

        <div>
          <input
            type="checkbox"
            id="terms-checkbox"
            name="terms-checkbox"
            required
          />
          <label for="terms-checkbox">Agree to the terms?</label>
        </div>

        <button type="submit">Submit</button>
      </form>
    </main>
  </body>
</html>
