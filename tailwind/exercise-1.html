<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ejercicio 1</title>
    <link rel="stylesheet" href="./output.css" />
  </head>

  <body class="bg-slate-100">
    <main class="flex min-h-screen items-center justify-center p-4">
      <article
        class="w-full overflow-hidden rounded-xl bg-white shadow-md md:max-w-sm"
      >
        <img
          class="h-56 w-full object-cover"
          src="https://placehold.co/600x400"
          alt="Auriculares inalámbricos negros"
        />

        <div class="p-6">
          <h1 class="text-2xl font-bold text-slate-900">
            Auriculares inalámbricos
          </h1>

          <p class="mt-2 text-slate-600">
            Auriculares cómodos con conexión Bluetooth y batería de larga
            duración.
          </p>

          <p class="mt-4 text-xl font-semibold text-slate-900">79,99 €</p>

          <button
            type="button"
            class="mt-6 w-full rounded-lg bg-blue-600 px-4 py-2 font-medium text-white transition hover:bg-blue-700 focus-visible:outline-none focus-visible:ring-2 focus-visible:ring-blue-500 focus-visible:ring-offset-2 active:scale-95"
          >
            Comprar
          </button>
        </div>
      </article>
    </main>
  </body>
</html>
